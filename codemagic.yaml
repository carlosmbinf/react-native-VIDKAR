workflows:
  expo_android_internal:
    name: Expo Android (AAB + Internal Testing)

    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: master
    #       include: true

    environment:
      android_signing:
        - keystore_reference
      groups:
        - google_credentials
        - vidkar
      node: 22
      java: 17

    cache:
      cache_paths:
        - node_modules
        - ~/.npm
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Clean yarn
        script: |
          rm -rf .yarn yarn.lock

      - name: Install deps
        script: |
          npm install --legacy-peer-deps

      - name: Clean android
        script: |
          rm -rf android

      - name: Expo prebuild
        script: |
          npx expo prebuild --platform android

      - name: Set versionCode & versionName
        script: |
          cd android/app

          BUILD_NUMBER=${PROJECT_BUILD_NUMBER:-0}
          VERSION_CODE=$((532 + BUILD_NUMBER))

          VERSION_NAME="4.0.$VERSION_CODE"

          echo "Build number: $BUILD_NUMBER"
          echo "Version code: $VERSION_CODE"
          echo "Version name: $VERSION_NAME"

          perl -pi -e "s/versionCode\s+\d+/versionCode $VERSION_CODE/g" build.gradle
          perl -pi -e "s/versionName\s+\"[^\"]+\"/versionName \"$VERSION_NAME\"/g" build.gradle

      - name: Build AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab

    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal

      email:
        recipients:
          - "carlosmbinf@gmail.com"
        notify:
          success: true
          failure: true

  expo_ios_internal:
    name: Expo iOS (TestFlight)

    max_build_duration: 120
    instance_type: mac_mini_m2

    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: master
    #       include: true

    integrations:
      app_store_connect: "VidkarAPIKey2"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vidkar
        # Codemagic también busca perfiles com.vidkar.*; deben existir perfiles App Store para cada extensión.
      node: 22
      xcode: 26.4.1
      cocoapods: default
      vars:
        BUNDLE_ID: "com.vidkar"
        XCODE_WORKSPACE: "Vidkar.xcworkspace"
        XCODE_SCHEME: "Vidkar"
        WATCH_TARGET: "VidkarWatch"
        WATCH_BUNDLE_ID: "com.vidkar.watchkitapp"
        NOTIFICATION_SERVICE_TARGET: "NotificationService"
        NOTIFICATION_SERVICE_BUNDLE_ID: "com.vidkar.notificationservice"
        WIDGET_TARGET: "ExpoWidgetsTarget"
        WIDGET_BUNDLE_ID: "com.vidkar.ExpoWidgetsTarget"

    cache:
      cache_paths:
        - node_modules
        - ios/Pods
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Clean yarn
        script: |
          rm -rf .yarn yarn.lock

      - name: Install deps
        script: |
          npm install --legacy-peer-deps

      - name: Clean ios
        script: |
          rm -rf ios

      - name: Expo prebuild (iOS)
        script: |
          npx expo prebuild --platform ios

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      # 🔥 VERSIONADO IGUAL QUE ANDROID
      - name: Set iOS version
        script: |
          cd ios

          BUILD_NUMBER=${PROJECT_BUILD_NUMBER:-0}
          VERSION_CODE=$((532 + BUILD_NUMBER))
          VERSION_NAME="4.0.$VERSION_CODE"

          echo "Version: $VERSION_NAME"
          echo "Build: $VERSION_CODE"

          INFO_PLIST="Vidkar/Info.plist"

          echo "Usando plist: $INFO_PLIST"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION_NAME" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION_CODE" "$INFO_PLIST"

          perl -pi -e "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $VERSION_CODE;/g" Vidkar.xcodeproj/project.pbxproj
          perl -pi -e "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $VERSION_NAME;/g" Vidkar.xcodeproj/project.pbxproj

      - name: Validate Apple Watch target
        script: |
          cd ios

          test -f "../targets/$WATCH_TARGET/expo-target.config.js"
          grep -q "$WATCH_TARGET.app in Embed Watch Content" Vidkar.xcodeproj/project.pbxproj
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $WATCH_BUNDLE_ID;" Vidkar.xcodeproj/project.pbxproj

          xcodebuild \
            -project Vidkar.xcodeproj \
            -target "$WATCH_TARGET" \
            -configuration Release \
            -sdk watchsimulator \
            build CODE_SIGNING_ALLOWED=NO

          xcodebuild \
            -project Vidkar.xcodeproj \
            -target "$WATCH_TARGET" \
            -configuration Release \
            -sdk watchos \
            -showBuildSettings | grep -E "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CURRENT_PROJECT_VERSION|MARKETING_VERSION|WKCompanion|WATCHOS_DEPLOYMENT_TARGET"

      - name: Validate iOS provisioning profiles
        script: |
          bash ./scripts/validate-ios-signing-profiles.sh \
            "$BUNDLE_ID" \
            "$WATCH_BUNDLE_ID" \
            "$NOTIFICATION_SERVICE_BUNDLE_ID" \
            "$WIDGET_BUNDLE_ID"

      # 🔐 Aplicar perfiles/certificados ya resueltos por Codemagic
      - name: Setup signing
        script: |
          xcode-project use-profiles

          echo "Release signing settings after use-profiles:"
          xcodebuild \
            -workspace "ios/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -showBuildSettings | grep -E "(^    TARGET_BUILD_DIR|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER)"

      - name: Build IPA
        script: |
          set -o pipefail
          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/xcarchive/Vidkar.xcarchive"
          EXPORT_PATH="$CM_BUILD_DIR/build/ios/ipa"

          rm -rf "$ARCHIVE_PATH" "$EXPORT_PATH"
          mkdir -p "$EXPORT_PATH"

          xcodebuild \
            -workspace "ios/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM=4TWB6RN383 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$HOME/export_options.plist" \
            -exportPath "$EXPORT_PATH"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      # beta_groups:
      #   - group PruebasVidkar

      email:
        recipients:
          - "carlosmbinf@gmail.com"
        notify:
          success: true
          failure: true

  expo_full_release:
    name: Expo Full Release (Android + iOS)

    instance_type: mac_mini_m2

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "release-*"
          include: true

    integrations:
      app_store_connect: "VidkarAPIKey2"

    environment:
      android_signing:
        - keystore_reference
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vidkar
        # Codemagic también busca perfiles com.vidkar.*; deben existir perfiles App Store para cada extensión.
      groups:
        - google_credentials
